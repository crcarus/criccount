<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>CriCount — Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    /* Tabler icons inline subset */
    @font-face {
      font-family: 'tabler-icons';
      src: url('https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/fonts/tabler-icons.woff2') format('woff2');
    }
    .ti { font-family: 'tabler-icons'; font-style: normal; font-weight: normal; speak: none; display: inline-block; }
    .ti-backspace::before { content: "\ea25"; }
    .ti-eye::before       { content: "\eb7a"; }
    .ti-eye-off::before   { content: "\ecf0"; }
    .ti-login::before     { content: "\f099"; }
  </style>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0 8px;
    }
    .pin-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      transition: background .15s, border-color .15s;
    }
    .pin-dot.filled {
      background: var(--brand);
      border-color: var(--brand);
    }
    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }
    .pin-key {
      aspect-ratio: 1;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg3);
      color: var(--text1);
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .12s, transform .1s;
      display: flex; align-items: center; justify-content: center;
    }
    .pin-key:active { transform: scale(.93); background: var(--brand); color: #fff; }
    .pin-key.del { color: var(--danger); font-size: 1rem; }
    .pin-key.empty { border: none; background: transparent; cursor: default; }

    .pass-toggle {
      display: flex; gap: 8px; justify-content: center;
      margin-bottom: 20px;
    }
    .pass-toggle button {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text2);
      font-size: 0.78rem; font-weight: 600;
      cursor: pointer;
      transition: background .12s, color .12s;
    }
    .pass-toggle button.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card animate">

    <div class="login-logo"><span>Cri</span>Count</div>
    <div class="login-sub">Gastos compartidos</div>

    <!-- Toggle PIN / Clave -->
    <div class="pass-toggle">
      <button id="btnPin" class="active" onclick="setMode('pin')">PIN</button>
      <button id="btnPass" onclick="setMode('pass')">Clave</button>
    </div>

    <!-- Modo PIN -->
    <div id="modoPin">
      <div class="pin-dots" id="pinDots">
        <div class="pin-dot" id="d0"></div>
        <div class="pin-dot" id="d1"></div>
        <div class="pin-dot" id="d2"></div>
        <div class="pin-dot" id="d3"></div>
      </div>
      <div class="pin-pad">
        <button class="pin-key" onclick="pinPress('1')">1</button>
        <button class="pin-key" onclick="pinPress('2')">2</button>
        <button class="pin-key" onclick="pinPress('3')">3</button>
        <button class="pin-key" onclick="pinPress('4')">4</button>
        <button class="pin-key" onclick="pinPress('5')">5</button>
        <button class="pin-key" onclick="pinPress('6')">6</button>
        <button class="pin-key" onclick="pinPress('7')">7</button>
        <button class="pin-key" onclick="pinPress('8')">8</button>
        <button class="pin-key" onclick="pinPress('9')">9</button>
        <button class="pin-key empty"></button>
        <button class="pin-key" onclick="pinPress('0')">0</button>
        <button class="pin-key del" onclick="pinDel()"><i class="ti ti-backspace"></i></button>
      </div>
    </div>

    <!-- Modo clave de texto -->
    <div id="modoPass" style="display:none">
      <div class="form-group" style="margin-bottom:12px; position:relative">
        <input type="password" id="inputPass" placeholder="Ingresa tu clave"
               onkeydown="if(event.key==='Enter') doLogin()" autocomplete="current-password">
        <button onclick="toggleVer()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:1rem">
          <i class="ti ti-eye" id="eyeIcon"></i>
        </button>
      </div>
      <button class="btn btn-primary" onclick="doLogin()">
        <i class="ti ti-login"></i> Entrar
      </button>
    </div>

    <div class="login-error" id="loginError"></div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/auth.js"></script>
<script>
  // Si ya está autenticado, ir directo
  if (isAuthenticated()) window.location.href = 'dashboard.html';

  let pinBuffer = '';
  let modo = 'pin';

  function setMode(m) {
    modo = m;
    document.getElementById('modoPin').style.display  = m === 'pin'  ? '' : 'none';
    document.getElementById('modoPass').style.display = m === 'pass' ? '' : 'none';
    document.getElementById('btnPin').classList.toggle('active',  m === 'pin');
    document.getElementById('btnPass').classList.toggle('active', m === 'pass');
    pinBuffer = '';
    actualizarDots();
    document.getElementById('loginError').textContent = '';
  }

  function pinPress(d) {
    if (pinBuffer.length >= 4) return;
    pinBuffer += d;
    actualizarDots();
    if (pinBuffer.length === 4) {
      setTimeout(function() { doLogin(); }, 120);
    }
  }

  function pinDel() {
    pinBuffer = pinBuffer.slice(0, -1);
    actualizarDots();
  }

  function actualizarDots() {
    for (var i = 0; i < 4; i++) {
      var dot = document.getElementById('d' + i);
      if (dot) dot.classList.toggle('filled', i < pinBuffer.length);
    }
  }

  function doLogin() {
    var clave = modo === 'pin' ? pinBuffer : document.getElementById('inputPass').value;
    var err   = document.getElementById('loginError');
    if (!clave) { err.textContent = 'Ingresa tu clave'; return; }
    if (login(clave)) {
      window.location.href = 'dashboard.html';
    } else {
      err.textContent = 'Clave incorrecta';
      pinBuffer = '';
      actualizarDots();
      if (modo === 'pass') document.getElementById('inputPass').value = '';
    }
  }

  function toggleVer() {
    var inp  = document.getElementById('inputPass');
    var icon = document.getElementById('eyeIcon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.className = 'ti ti-eye-off';
    } else {
      inp.type = 'password';
      icon.className = 'ti ti-eye';
    }
  }
</script>
</body>
</html>
