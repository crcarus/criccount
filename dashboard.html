<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>CriCount — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    .kpi-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
    .kpi-card {
      background:var(--bg2); border:1px solid var(--border);
      border-radius:var(--radius); padding:12px 14px; box-shadow:var(--shadow);
    }
    .kpi-label { font-size:0.68rem; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
    .kpi-val   { font-family:var(--mono); font-size:1.05rem; font-weight:700; color:var(--text1); }
    .kpi-sub   { font-size:0.7rem; color:var(--text3); margin-top:3px; }
    .kpi-delta { font-size:0.72rem; font-weight:600; margin-top:4px; display:block; }
    .kpi-delta.up   { color:var(--danger); }
    .kpi-delta.down { color:var(--success); }
    .kpi-card.danger  { border-color:var(--danger); }

    .comp-bar {
      background:var(--bg2); border:1px solid var(--border);
      border-radius:var(--radius); padding:10px 14px;
      display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap;
    }
    .comp-bar label { font-size:0.75rem; color:var(--text3); white-space:nowrap; }
    .comp-bar select { flex:1; min-width:130px; font-size:0.82rem; }

    .donut-wrap {
      display:flex; align-items:center; gap:16px;
      background:var(--bg2); border:1px solid var(--border);
      border-radius:var(--radius); padding:14px; margin-bottom:14px; box-shadow:var(--shadow);
    }
    .donut-canvas-wrap { position:relative; width:90px; height:90px; flex-shrink:0; }
    .donut-center {
      position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; pointer-events:none;
    }
    .donut-pct { font-family:var(--mono); font-size:1rem; font-weight:700; }
    .donut-lbl { font-size:0.6rem; color:var(--text3); }
    .donut-info { flex:1; }
    .donut-title { font-size:0.8rem; font-weight:600; margin-bottom:6px; }
    .donut-row  { display:flex; justify-content:space-between; font-size:0.75rem; margin-bottom:3px; }
    .donut-row .dl { color:var(--text3); }
    .donut-row .dv { font-family:var(--mono); font-weight:600; }

    .deuda-card {
      background:var(--bg2); border:1px solid var(--border);
      border-radius:var(--radius); padding:14px; margin-bottom:14px; box-shadow:var(--shadow);
    }
    .deuda-title { font-size:0.82rem; font-weight:700; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
    .personas-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    .persona-col { background:var(--bg3); border-radius:var(--radius-sm); padding:10px; }
    .persona-name { font-size:0.75rem; font-weight:700; margin-bottom:7px; }
    .persona-row { display:flex; justify-content:space-between; font-size:0.72rem; margin-bottom:3px; }
    .persona-row .pl { color:var(--text3); }
    .persona-row .pv { font-family:var(--mono); font-weight:600; }
    .deuda-resumen { background:var(--bg3); border-radius:var(--radius-sm); padding:10px; text-align:center; }
    .deuda-resumen .dr-lbl { font-size:0.72rem; color:var(--text3); }
    .deuda-resumen .dr-val { font-family:var(--mono); font-size:1rem; font-weight:700; margin:4px 0; }
    .deuda-resumen .dr-quien { font-size:0.75rem; font-weight:600; }
    .deuda-resumen.saldado .dr-val { color:var(--success); }

    .alertas-wrap { margin-bottom:14px; display:flex; flex-direction:column; gap:6px; }
    .alerta-row {
      display:flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:var(--radius-sm); font-size:0.78rem;
    }
    .alerta-row.danger  { background:rgba(239,68,68,.12); color:var(--danger); border:1px solid rgba(239,68,68,.25); }
    .alerta-row.warning { background:rgba(251,191,36,.1);  color:#d97706;       border:1px solid rgba(251,191,36,.3); }
    .alerta-row .ai { font-size:0.72rem; margin-left:auto; font-family:var(--mono); font-weight:600; }

    .insights-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
    .insight-card {
      background:var(--bg2); border:1px solid var(--border);
      border-radius:var(--radius-sm); padding:10px 12px;
    }
    .insight-icon { font-size:1.2rem; margin-bottom:4px; }
    .insight-lbl  { font-size:0.65rem; color:var(--text3); text-transform:uppercase; letter-spacing:.4px; }
    .insight-val  { font-size:0.82rem; font-weight:700; margin-top:2px; }

    .cat-item {
      background:var(--bg2); border:1px solid var(--border);
      border-radius:var(--radius-sm); overflow:hidden; margin-bottom:8px;
    }
    .cat-header {
      display:flex; align-items:center; gap:8px;
      padding:10px 12px; cursor:pointer; user-select:none; transition:background .15s;
    }
    .cat-header:hover { background:var(--bg3); }
    .cat-emoji  { font-size:1.1rem; width:28px; text-align:center; flex-shrink:0; }
    .cat-info   { flex:1; min-width:0; }
    .cat-nombre { font-size:0.82rem; font-weight:600; }
    .cat-bar-wrap { display:flex; align-items:center; gap:6px; margin-top:4px; }
    .cat-bar-bg   { flex:1; height:5px; background:var(--bg3); border-radius:3px; overflow:hidden; }
    .cat-bar-fill { height:100%; border-radius:3px; transition:width .4s; }
    .cat-bar-pct  { font-size:0.65rem; color:var(--text3); min-width:28px; text-align:right; font-family:var(--mono); }
    .cat-right  { text-align:right; flex-shrink:0; }
    .cat-monto  { font-family:var(--mono); font-size:0.85rem; font-weight:700; }
    .cat-vs     { font-size:0.65rem; color:var(--text3); margin-top:2px; }
    .cat-delta  { font-size:0.65rem; font-weight:600; }
    .cat-delta.up   { color:var(--danger); }
    .cat-delta.down { color:var(--success); }
    .liq-delta  { font-size:0.68rem; font-weight:600; margin-left:6px; }
    .liq-delta.up   { color:var(--danger); }
    .liq-delta.down { color:var(--success); }
    /* Gráfico histórico por categoría */
    .hist-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:14px; box-shadow:var(--shadow); }
    .hist-title { font-size:0.82rem; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .hist-select { font-size:0.82rem; border:1px solid var(--border); border-radius:8px; padding:4px 8px; background:var(--bg); color:var(--text1); flex:1; min-width:140px; }
    .hist-canvas-wrap { position:relative; height:180px; }
    .cat-chevron { font-size:0.75rem; color:var(--text3); margin-left:4px; transition:transform .2s; flex-shrink:0; }
    .cat-header.open .cat-chevron { transform:rotate(90deg); }
    .cat-gastos { display:none; border-top:1px solid var(--border); }
    .cat-gastos.open { display:block; }
    .gasto-row {
      display:flex; align-items:center; gap:8px;
      padding:8px 12px; border-bottom:1px solid var(--border); font-size:0.78rem;
    }
    .gasto-row:last-child { border-bottom:none; }
    .gasto-titulo { flex:1; min-width:0; }
    .gasto-t  { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .gasto-d  { font-size:0.68rem; color:var(--text3); }
    .gasto-monto { font-family:var(--mono); font-weight:700; text-align:right; flex-shrink:0; }
    .gasto-who   { font-size:0.68rem; color:var(--text3); background:var(--bg3); padding:1px 5px; border-radius:10px; flex-shrink:0; }

    .chart-card {
      background:var(--bg2); border:1px solid var(--border);
      border-radius:var(--radius); padding:14px; margin-bottom:14px; box-shadow:var(--shadow);
    }
    .chart-title { font-size:0.82rem; font-weight:700; margin-bottom:10px; }
    .chart-canvas-wrap { position:relative; height:180px; }

    .sec-head { display:flex; align-items:center; justify-content:space-between; margin:16px 0 8px; }
    .sec-head h3 { font-size:0.82rem; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; }
    .sec-badge { font-size:0.7rem; color:var(--text3); background:var(--bg3); padding:2px 7px; border-radius:10px; }

    .period-bar {
      background:var(--bg2); border:1px solid var(--border);
      border-radius:var(--radius); padding:10px 14px;
      display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap;
    }
    .period-bar label { font-size:0.75rem; color:var(--text3); white-space:nowrap; }
    .period-bar select { flex:1; min-width:130px; }

    .ppt-bar-card {
      background:var(--bg2); border:1px solid var(--border);
      border-radius:var(--radius); padding:12px 14px; margin-bottom:10px;
    }
    .ppt-bar-top { display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.78rem; }
    .ppt-bar-top .ppl { font-weight:600; }
    .ppt-bar-top .ppv { font-family:var(--mono); font-weight:700; }
    .ppt-bar-bg   { height:8px; background:var(--bg3); border-radius:4px; overflow:hidden; }
    .ppt-bar-fill { height:100%; border-radius:4px; transition:width .5s; }
  </style>
</head>
<body>

<nav class="nav">
  <button class="nav-hamburger" onclick="openDrawer()">☰</button>
  <div class="nav-brand"><span>Cri</span>Count</div>
  <button class="nav-fab-top" onclick="irA('formulario')" title="Nuevo gasto">＋</button>
</nav>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer-panel" id="drawerPanel">
  <div class="drawer-header">
    <div class="drawer-brand"><span>Cri</span>Count</div>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <button class="drawer-item active" onclick="closeDrawer()">📊 <span>Dashboard</span></button>
  <button class="drawer-item" onclick="closeDrawer();irA('registros')">📋 <span>Registros</span></button>
  <button class="drawer-item" onclick="closeDrawer();irA('presupuesto')">📈 <span>Presupuesto</span></button>
  <button class="drawer-item" onclick="closeDrawer();irA('formulario')">➕ <span>Nuevo gasto</span></button>
  <div class="drawer-sep"></div>
  <button class="drawer-item" onclick="logout()">🚪 <span>Cerrar sesión</span></button>
</div>

<div class="page" id="page">
  <div style="text-align:center;padding:60px 0;color:var(--text3)">
    <span class="loader"></span>
    <div style="margin-top:12px;font-size:0.85rem">Cargando dashboard...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script>
requireAuth();

var _periodo  = '';
var _periodos = [];
var _compPer  = '';
var _data     = null;
var _dataComp = null;
var _lineChart= null;
var _histChart= null;
var _histData  = {};   // {periodo: {cat: monto}}
var _histPeriodos = [];

/* ── HELPERS ── */
function clp(n){ return '$'+Math.round(n||0).toLocaleString('es-CL'); }
function pct(v,t){ return t>0?Math.min(100,Math.round(v/t*100)):0; }
function colorPct(p){ return p>=100?'var(--danger)':p>=80?'var(--warning)':'var(--success)'; }

function periodoLabel(p){
  if(!p) return p;
  var m=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var pt=p.split('-'); return m[parseInt(pt[1])-1]+' '+pt[0];
}
function periodoShort(p){
  if(!p) return p;
  var m=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var pt=p.split('-'); return m[parseInt(pt[1])-1]+' '+pt[0];
}
function prevPeriodo(p){
  var pt=p.split('-'); var y=parseInt(pt[0]),mo=parseInt(pt[1])-1;
  if(mo<1){mo=12;y--;} return y+'-'+String(mo).padStart(2,'0');
}
function deltaHtml(actual,comp,menorEsMejor){
  if(comp===null||comp===undefined) return '';
  var diff=actual-comp; if(!diff) return '<span class="kpi-delta" style="color:var(--text3)">= igual que '+periodoShort(_compPer)+'</span>';
  var isUp=diff>0; var cls=(menorEsMejor?isUp:!isUp)?'up':'down';
  return '<span class="kpi-delta '+cls+'">'+(isUp?'▲':'▼')+' '+clp(Math.abs(diff))+' vs '+periodoShort(_compPer)+'</span>';
}

/* ── DRAWER ── */
function openDrawer(){ document.getElementById('drawerOverlay').classList.add('open'); document.getElementById('drawerPanel').classList.add('open'); document.body.style.overflow='hidden'; }
function closeDrawer(){ document.getElementById('drawerOverlay').classList.remove('open'); document.getElementById('drawerPanel').classList.remove('open'); document.body.style.overflow=''; }

/* ── RENDER ── */
function render(){
  var d=_data, dc=_dataComp;
  var totalGastado     = d.totalGastado     ||0;
  var totalPresupuesto = d.totalPresupuesto ||0;
  var promDiario       = d.promDiario       ||0;
  var sobrePpt         = totalGastado - totalPresupuesto;
  var totalP1          = d.totalP1  ||0;
  var totalP2          = d.totalP2  ||0;
  var pagadoP1         = d.pagadoP1 ||0;
  var pagadoP2         = d.pagadoP2 ||0;
  // Calculamos saldo localmente igual que registros: pagado - corresponde_por_division
  var deudaP1          = pagadoP1 - totalP1;
  var participantes    = d.participantes||['Claush','Cri'];
  var p1name=participantes[0]||'Claush', p2name=participantes[1]||'Cri';
  var pptPct=pct(totalGastado,totalPresupuesto);
  var pptColor=colorPct(pptPct);

  /* Selects */
  var periodOpts=_periodos.map(function(p){ return '<option value="'+p+'"'+(p===_periodo?' selected':'')+'>'+periodoLabel(p)+'</option>'; }).join('');
  var compOpts=_periodos.filter(function(p){ return p!==_periodo; }).map(function(p){ return '<option value="'+p+'"'+(p===_compPer?' selected':'')+'>'+periodoLabel(p)+'</option>'; }).join('');

  /* KPIs */
  var kpiTotalComp=dc?(dc.totalGastado||0):null;
  var kpiPptComp  =dc?(dc.totalPresupuesto||0):null;
  var kpiPromComp =dc?(dc.promDiario||0):null;
  var sobreClass  =sobrePpt>0?'danger':'';

  var kpiHtml=
    '<div class="kpi-grid animate">'
    +'<div class="kpi-card"><div class="kpi-label">Total gastado</div><div class="kpi-val">'+clp(totalGastado)+'</div>'+deltaHtml(totalGastado,kpiTotalComp,true)+'</div>'
    +'<div class="kpi-card"><div class="kpi-label">Presupuesto</div><div class="kpi-val">'+clp(totalPresupuesto)+'</div>'+deltaHtml(totalPresupuesto,kpiPptComp,false)+'</div>'
    +'<div class="kpi-card '+sobreClass+'"><div class="kpi-label">'+(sobrePpt>=0?'⚠️ Sobre ppt':'✅ Disponible')+'</div>'
      +'<div class="kpi-val" style="color:'+(sobrePpt>0?'var(--danger)':'var(--success)')+'">'+clp(Math.abs(sobrePpt))+'</div>'
      +'<div class="kpi-sub">'+(sobrePpt>0?'excedido':'disponible')+'</div></div>'
    +'<div class="kpi-card"><div class="kpi-label">Prom. diario</div><div class="kpi-val">'+clp(promDiario)+'</div>'+deltaHtml(promDiario,kpiPromComp,true)+'</div>'
    +'</div>';

  /* Comp bar */
  var compHtml=
    '<div class="comp-bar animate delay-1">'
    +'<label>Comparar con:</label>'
    +'<select onchange="cambiarComp(this.value)">'+compOpts+'</select>'
    +'</div>';

  /* PPT bar */
  var pptBarHtml=
    '<div class="ppt-bar-card animate delay-1">'
    +'<div class="ppt-bar-top"><span class="ppl">Ejecución presupuesto</span><span class="ppv">'+clp(totalGastado)+' / '+clp(totalPresupuesto)+'</span></div>'
    +'<div class="ppt-bar-bg"><div class="ppt-bar-fill" style="width:'+pptPct+'%;background:'+pptColor+'"></div></div>'
    +'<div style="font-size:0.7rem;color:var(--text3);margin-top:4px;text-align:right">'+pptPct+'% ejecutado</div>'
    +'</div>';

  /* Donut */
  var rest=Math.max(0,100-pptPct);
  var dcTotalGastado=dc?clp(dc.totalGastado||0):'';
  var donutHtml=
    '<div class="donut-wrap animate delay-1">'
    +'<div class="donut-canvas-wrap"><canvas id="donutChart"></canvas>'
      +'<div class="donut-center"><div class="donut-pct" style="color:'+pptColor+'">'+pptPct+'%</div><div class="donut-lbl">de ppt</div></div>'
    +'</div>'
    +'<div class="donut-info"><div class="donut-title">Resumen período</div>'
      +'<div class="donut-row"><span class="dl">Gastado</span><span class="dv">'+clp(totalGastado)+'</span></div>'
      +'<div class="donut-row"><span class="dl">Presupuesto</span><span class="dv">'+clp(totalPresupuesto)+'</span></div>'
      +'<div class="donut-row"><span class="dl">'+(sobrePpt>=0?'Exceso':'Disponible')+'</span><span class="dv" style="color:'+(sobrePpt>0?'var(--danger)':'var(--success)')+'">'+clp(Math.abs(sobrePpt))+'</span></div>'
      +(dc?'<div class="donut-row" style="border-top:1px solid var(--border);margin-top:5px;padding-top:5px"><span class="dl">'+periodoShort(_compPer)+'</span><span class="dv">'+dcTotalGastado+'</span></div>':'')
    +'</div></div>';

  /* Liquidación */
  // totalP1/totalP2 = suma de montoP1/montoP2 = lo que le corresponde pagar según división real
  // pagadoP1/pagadoP2 = lo que desembolsó de su bolsillo
  // deudaP1 ya calculado arriba como pagadoP1 - totalP1
  var montoDeuda=Math.abs(deudaP1);
  var deudorName=deudaP1<0?p1name:p2name;   // negativo → P1 pagó menos → P1 debe
  var acreedName=deudaP1<0?p2name:p1name;
  var deudaHtml=
    '<div class="deuda-card animate delay-2">'
    +'<div class="deuda-title"><span>💳 Liquidación del período</span>'+(dc?'<span class="sec-badge">vs '+periodoShort(_compPer)+'</span>':'')+'</div>'
    +'<div class="personas-grid">'
      +'<div class="persona-col"><div class="persona-name">👤 '+p1name+'</div>'
        +'<div class="persona-row"><span class="pl">Pagó de su bolsillo</span><span class="pv">'+clp(pagadoP1)+(dc&&dc.pagadoP1!=null?'<span class="liq-delta '+(pagadoP1>(dc.pagadoP1||0)?'up':'down')+'"> '+(pagadoP1>(dc.pagadoP1||0)?'▲':'▼')+clp(Math.abs(pagadoP1-(dc.pagadoP1||0)))+'</span>':'')+'</span></div>'
        +'<div class="persona-row"><span class="pl">Le corresponde</span><span class="pv">'+clp(totalP1)+(dc&&dc.totalP1!=null?'<span class="liq-delta '+(totalP1>(dc.totalP1||0)?'up':'down')+'"> '+(totalP1>(dc.totalP1||0)?'▲':'▼')+clp(Math.abs(totalP1-(dc.totalP1||0)))+'</span>':'')+'</span></div>'
        +'<div class="persona-row" style="font-weight:600;color:'+(pagadoP1>=totalP1?'var(--success)':'var(--danger)')+'"><span class="pl">Diferencia</span><span class="pv">'+(pagadoP1>=totalP1?'+':'')+clp(pagadoP1-totalP1)+'</span></div>'
      +'</div>'
      +'<div class="persona-col"><div class="persona-name">👤 '+p2name+'</div>'
        +'<div class="persona-row"><span class="pl">Pagó de su bolsillo</span><span class="pv">'+clp(pagadoP2)+(dc&&dc.pagadoP2!=null?'<span class="liq-delta '+(pagadoP2>(dc.pagadoP2||0)?'up':'down')+'"> '+(pagadoP2>(dc.pagadoP2||0)?'▲':'▼')+clp(Math.abs(pagadoP2-(dc.pagadoP2||0)))+'</span>':'')+'</span></div>'
        +'<div class="persona-row"><span class="pl">Le corresponde</span><span class="pv">'+clp(totalP2)+(dc&&dc.totalP2!=null?'<span class="liq-delta '+(totalP2>(dc.totalP2||0)?'up':'down')+'"> '+(totalP2>(dc.totalP2||0)?'▲':'▼')+clp(Math.abs(totalP2-(dc.totalP2||0)))+'</span>':'')+'</span></div>'
        +'<div class="persona-row" style="font-weight:600;color:'+(pagadoP2>=totalP2?'var(--success)':'var(--danger)')+'"><span class="pl">Diferencia</span><span class="pv">'+(pagadoP2>=totalP2?'+':'')+clp(pagadoP2-totalP2)+'</span></div>'
      +'</div>'
    +'</div>'
    +(montoDeuda>0
      ?'<div class="deuda-resumen"><div class="dr-lbl">Resultado</div><div class="dr-val">'+clp(montoDeuda)+'</div><div class="dr-quien">'+deudorName+' le debe a '+acreedName+'</div></div>'
      :'<div class="deuda-resumen saldado"><div class="dr-lbl">Estado</div><div class="dr-val">✅ Saldado</div><div class="dr-quien">Sin deudas pendientes</div></div>'
    )
    +'</div>';

  /* Insights */
  var cats=d.porCategoria||{}; var pres=d.presupuesto||{};
  var catList=Object.keys(cats).map(function(k){ return {nombre:k,monto:cats[k]||0,ppt:pres[k]||0}; });
  catList.sort(function(a,b){ return b.monto-a.monto; });
  var topCat=catList[0]||null;
  var critCat=catList.filter(function(c){ return c.ppt>0&&c.monto>=c.ppt; })[0]||null;
  var pt2=_periodo.split('-'); var y0=parseInt(pt2[0]),m0=parseInt(pt2[1]);
  var hoy=new Date(); var ultimoDia=new Date(y0,m0,0).getDate();
  var diasRest=(y0===hoy.getFullYear()&&m0===hoy.getMonth()+1)?ultimoDia-hoy.getDate():0;

  var insightsHtml=
    '<div class="insights-grid animate delay-2">'
    +'<div class="insight-card"><div class="insight-icon">🏆</div><div class="insight-lbl">Mayor categoría</div><div class="insight-val">'+(topCat?topCat.nombre:'—')+'</div></div>'
    +'<div class="insight-card"><div class="insight-icon">🚨</div><div class="insight-lbl">Categoría crítica</div><div class="insight-val">'+(critCat?critCat.nombre:'Ninguna ✅')+'</div></div>'
    +'<div class="insight-card"><div class="insight-icon">📅</div><div class="insight-lbl">Días restantes</div><div class="insight-val">'+(diasRest>0?diasRest+' días':'Período cerrado')+'</div></div>'
    +'<div class="insight-card"><div class="insight-icon">'+(pptPct<80?'✅':pptPct<100?'⚠️':'🔴')+'</div><div class="insight-lbl">Estado presupuesto</div>'
      +'<div class="insight-val" style="color:'+(pptPct<80?'var(--success)':pptPct<100?'var(--warning)':'var(--danger)')+'">'+(pptPct<80?'Bajo control':pptPct<100?'Atención':'Excedido')+'</div></div>'
    +'</div>';

  /* Alertas */
  var alertas=catList.filter(function(c){ return c.ppt>0&&pct(c.monto,c.ppt)>=80; });
  var alertasHtml='';
  if(alertas.length){
    alertasHtml='<div class="alertas-wrap animate delay-2">';
    alertas.forEach(function(c){
      var pp=pct(c.monto,c.ppt); var cls=pp>=100?'danger':'warning'; var icon=pp>=100?'🔴':'🟡';
      alertasHtml+='<div class="alerta-row '+cls+'">'+icon+' <strong>'+c.nombre+'</strong> — '+clp(c.monto)+' de '+clp(c.ppt)+'<span class="ai">'+pp+'%</span></div>';
    });
    alertasHtml+='</div>';
  }

  /* Categorías acordeón */
  var gastosDetalle=d.gastosDetalle||[];
  var catInfoMap={}; (d.categorias||[]).forEach(function(c){ catInfoMap[c.nombre]=c; });
  var dcCats=dc?(dc.porCategoria||{}):null;

  var catsHtml='<div class="animate delay-2">';
  catList.forEach(function(c){
    var pp=pct(c.monto,c.ppt); var color=colorPct(pp);
    var cInfo=catInfoMap[c.nombre]||{}; var emoji=cInfo.emoji||'📌';
    var gastosCat=gastosDetalle.filter(function(g){ return g.categoria===c.nombre; });
    var catId='cat_'+c.nombre.replace(/\W/g,'_');
    var compMonto=dcCats?(dcCats[c.nombre]||0):null;
    var dH='';
    if(compMonto!==null){ var diff=c.monto-compMonto; dH=diff>0?'<span class="cat-delta up">▲'+clp(diff)+'</span>':diff<0?'<span class="cat-delta down">▼'+clp(Math.abs(diff))+'</span>':''; }

    catsHtml+=
      '<div class="cat-item">'
      +'<div class="cat-header" onclick="toggleCat(\''+catId+'\')" id="h_'+catId+'">'
        +'<div class="cat-emoji">'+emoji+'</div>'
        +'<div class="cat-info"><div class="cat-nombre">'+c.nombre+'</div>'
          +(c.ppt>0?'<div class="cat-bar-wrap"><div class="cat-bar-bg"><div class="cat-bar-fill" style="width:'+pp+'%;background:'+color+'"></div></div><span class="cat-bar-pct">'+pp+'%</span></div>':'')
        +'</div>'
        +'<div class="cat-right"><div class="cat-monto">'+clp(c.monto)+'</div>'+(c.ppt>0?'<div class="cat-vs">de '+clp(c.ppt)+'</div>':'')+dH+'</div>'
        +(gastosCat.length?'<span class="cat-chevron">▶</span>':'<span class="cat-chevron" style="opacity:0">▶</span>')
      +'</div>'
      +(gastosCat.length
        ?'<div class="cat-gastos" id="'+catId+'">'
          +gastosCat.map(function(g){
            return '<div class="gasto-row"><div class="gasto-titulo"><div class="gasto-t">'+g.titulo+'</div><div class="gasto-d">'+g.fecha+'</div></div>'
              +'<span class="gasto-who">'+g.responsable+'</span><div class="gasto-monto">'+clp(g.monto)+'</div></div>';
          }).join('')
          +'</div>'
        :'')
      +'</div>';
  });
  catsHtml+='</div>';

  /* Gráfico */
  var chartHtml=
    '<div class="chart-card animate delay-3"><div class="chart-title">📈 Gasto acumulado del período</div>'
    +'<div class="chart-canvas-wrap"><canvas id="lineChart"></canvas></div></div>';

  /* Ensamble */
  var html='';
  html+='<div class="period-bar animate"><label>Período:</label><select onchange="cambiarPeriodo(this.value)">'+periodOpts+'</select></div>';
  html+=kpiHtml;
  html+=compHtml;
  html+=pptBarHtml;
  html+=donutHtml;
  html+='<div class="sec-head animate delay-2"><h3>💡 Insights</h3></div>'+insightsHtml;
  if(alertasHtml){ html+='<div class="sec-head animate delay-2"><h3>⚠️ Alertas</h3></div>'+alertasHtml; }
  html+='<div class="sec-head animate delay-2"><h3>💳 Liquidación</h3></div>'+deudaHtml;
  html+='<div class="sec-head animate delay-2"><h3>📦 Categorías</h3>'+(dc?'<span class="sec-badge">vs '+periodoShort(_compPer)+'</span>':'')+'</div>'+catsHtml;
  html+=chartHtml;
  /* Gráfico histórico por categoría */
  var allCats=catList.map(function(c){ return c.nombre; });
  var histHtml='<div class="hist-card animate delay-3">'
    +'<div class="hist-title">📊 Evolución por categoría'
    +'<select class="hist-select" id="histCatSel" onchange="renderHistChart(this.value)">'
    +allCats.map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join('')
    +'</select></div>'
    +'<div class="hist-canvas-wrap"><canvas id="histChart"></canvas></div>'
    +'</div>';
  html+='<div class="sec-head animate delay-3"><h3>📊 Evolución histórica</h3></div>'+histHtml;
  document.getElementById('page').innerHTML=html;

  /* Donut */
  var dCtx=document.getElementById('donutChart');
  if(dCtx){
    new Chart(dCtx.getContext('2d'),{
      type:'doughnut',
      data:{datasets:[{data:[pptPct,rest],backgroundColor:[pptColor,'rgba(100,116,139,.15)'],borderWidth:0}]},
      options:{cutout:'75%',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},animation:{duration:600}}
    });
  }

  /* Line */
  var lCtx=document.getElementById('lineChart');
  if(lCtx) renderLineChart(lCtx,d);

  /* Guardar datos de este período para el historial */
  _histData[_periodo] = d.porCategoria||{};
  if(_histPeriodos.indexOf(_periodo)<0) _histPeriodos.push(_periodo);

  /* Cargar historial de todos los períodos en background */
  var periodos=d.periodos||[];
  periodos.forEach(function(p){
    if(p===_periodo || _histData[p]) return;
    fetch(API_URL+'?action=getDashboard&periodo='+p)
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(res&&res.porCategoria){
          _histData[p]=res.porCategoria;
          if(_histPeriodos.indexOf(p)<0) _histPeriodos.push(p);
        }
      }).catch(function(){});
  });

  /* Hist chart */
  var hCtx=document.getElementById('histChart');
  var firstCat=document.getElementById('histCatSel');
  if(hCtx&&firstCat) setTimeout(function(){ renderHistChart(firstCat.value); },400);
}

function renderLineChart(ctx,d){
  if(_lineChart){_lineChart.destroy();_lineChart=null;}
  var acumulado=d.acumulado||{}; var porDia=d.porDia||{}; var totalPpt=d.totalPresupuesto||0;
  var dias=Object.keys(acumulado).sort(); if(!dias.length) dias=Object.keys(porDia).sort();
  var pt2=_periodo.split('-'); var y0=parseInt(pt2[0]),m0=parseInt(pt2[1]);
  var hoy=new Date(); var totalDias=new Date(y0,m0,0).getDate();
  var diaHoy=(y0===hoy.getFullYear()&&m0===hoy.getMonth()+1)?hoy.getDate():totalDias;
  if(!dias.length){ for(var dd=1;dd<=diaHoy;dd++) dias.push(_periodo+'-'+String(dd).padStart(2,'0')); }
  var labels=dias.map(function(dd){ return dd.split('-')[2]; });
  var acumData=dias.map(function(dd){ var v=acumulado[dd]; return (v!==undefined&&v!==null)?v:null; });
  var pdData  =dias.map(function(dd){ var v=porDia[dd];    return (v!==undefined&&v!==null)?v:null; });
  var pptData =dias.map(function(dd,i){ return Math.round(totalPpt*(i+1)/totalDias); });
  var isDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  var gridColor=isDark?'rgba(255,255,255,.08)':'rgba(0,0,0,.07)';
  var textColor=isDark?'rgba(255,255,255,.5)':'rgba(0,0,0,.45)';
  _lineChart=new Chart(ctx.getContext('2d'),{
    type:'line',
    data:{labels:labels,datasets:[
      {label:'Acumulado',data:acumData,borderColor:'#6366f1',backgroundColor:'rgba(99,102,241,.15)',borderWidth:2,fill:true,tension:.35,pointRadius:0,pointHoverRadius:4,spanGaps:true},
      {label:'Por día',   data:pdData,  borderColor:'#34d399',backgroundColor:'transparent',borderWidth:1.5,fill:false,tension:.3,pointRadius:0,pointHoverRadius:3,spanGaps:true},
      {label:'Ppto.',     data:pptData, borderColor:'#f97316',backgroundColor:'transparent',borderWidth:1.5,borderDash:[5,4],fill:false,tension:0,pointRadius:0,pointHoverRadius:0}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:true,position:'top',labels:{boxWidth:12,padding:10,font:{size:11},color:textColor}},
        tooltip:{callbacks:{label:function(c){ return ' '+c.dataset.label+': $'+Math.round(c.raw||0).toLocaleString('es-CL'); }}}
      },
      scales:{
        x:{grid:{color:gridColor},ticks:{color:textColor,font:{size:10},maxTicksLimit:10}},
        y:{grid:{color:gridColor},ticks:{color:textColor,font:{size:10},maxTicksLimit:5,callback:function(v){ return '$'+Math.round(v).toLocaleString('es-CL'); }}}
      }
    }
  });
}

function toggleCat(id){
  var el=document.getElementById(id); var hd=document.getElementById('h_'+id); if(!el) return;
  el.classList.toggle('open'); if(hd) hd.classList.toggle('open');
}

function cambiarPeriodo(p){
  _periodo=p; _compPer=prevPeriodo(p); spinner(); cargar();
}
function cambiarComp(p){
  _compPer=p;
  spinner();
  API.getDashboard(_compPer).then(function(r){ _dataComp=r; render(); }).catch(function(e){ showToast(e.message,'error'); render(); });
}
function spinner(){
  document.getElementById('page').innerHTML='<div style="text-align:center;padding:60px 0;color:var(--text3)"><span class="loader"></span><div style="margin-top:12px;font-size:0.85rem">Cargando...</div></div>';
}
function cargar(){
  // getResumenPeriodos es opcional — si falla, seguimos con el período actual
  var resumenPromise = API.getResumenPeriodos().catch(function(){ return null; });

  resumenPromise.then(function(res){
    if(res && res.periodos && res.periodos.length){
      _periodos = res.periodos.map(function(p){ return p.periodo||p; });
    } else {
      _periodos = [_periodo];
    }
    if(_periodos.indexOf(_periodo)<0) _periodos.unshift(_periodo);
    if(_compPer && _periodos.indexOf(_compPer)<0) _periodos.push(_compPer);

    // Cargar dashboard actual y de comparación en paralelo
    var compPromise = _compPer
      ? API.getDashboard(_compPer).catch(function(){ return null; })
      : Promise.resolve(null);

    return Promise.all([API.getDashboard(_periodo), compPromise]);
  }).then(function(r){
    _data=r[0]; _dataComp=r[1];
    if(!_data || _data.error){ showToast('Error: '+(_data&&_data.error||'sin datos'),'error'); return; }
    render();
  }).catch(function(e){
    document.getElementById('page').innerHTML='<div style="text-align:center;padding:40px;color:var(--danger)">⚠️ '+e.message+'</div>';
  });
}

var _now=new Date();
_periodo=_now.getFullYear()+'-'+String(_now.getMonth()+1).padStart(2,'0');
_compPer=prevPeriodo(_periodo);
cargar();

function renderHistChart(cat){
  var hCtx=document.getElementById('histChart');
  if(!hCtx) return;
  if(_histChart){_histChart.destroy();_histChart=null;}
  // Ordenar períodos cronológicamente
  var pers=Object.keys(_histData).sort();
  var labels=pers.map(function(p){ return periodoShort(p); });
  var datos=pers.map(function(p){ return _histData[p][cat]||0; });
  var isDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  var gridColor=isDark?'rgba(255,255,255,.08)':'rgba(0,0,0,.07)';
  var textColor=isDark?'rgba(255,255,255,.5)':'rgba(0,0,0,.45)';
  // Color de barra según si está sobre presupuesto
  var pres=(_data&&_data.presupuesto&&_data.presupuesto[cat])||0;
  var bgColors=datos.map(function(v,i){
    var isActual=pers[i]===_periodo;
    if(isActual) return v>pres&&pres>0?'rgba(239,68,68,.85)':'rgba(99,102,241,.85)';
    return v>pres&&pres>0?'rgba(239,68,68,.45)':'rgba(99,102,241,.35)';
  });
  _histChart=new Chart(hCtx.getContext('2d'),{
    type:'bar',
    data:{labels:labels,datasets:[
      {label:cat,data:datos,backgroundColor:bgColors,borderRadius:6,borderSkipped:false},
      pres>0?{label:'Presupuesto',data:pers.map(function(){ return pres; }),type:'line',borderColor:'#f97316',borderDash:[5,4],borderWidth:1.5,pointRadius:0,fill:false}:null
    ].filter(Boolean)},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){ return ' '+clp(c.raw); }}}},
      scales:{
        x:{grid:{color:gridColor},ticks:{color:textColor,font:{size:10}}},
        y:{grid:{color:gridColor},ticks:{color:textColor,font:{size:10},callback:function(v){ return '$'+Math.round(v/1000)+'k'; }},beginAtZero:true}
      }
    }
  });
}
</script>
</body>
</html>
